<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>configuraçoes de conta</title>
    <script src="script6.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
    
    <div class="container" style="overflow-wrap: break-word; width: 40%;" id="main">
        <div class="row d-flex align-content-center justify-content-between m-2">
            <img src="pfp.png" style="width: 70px; height: 70px; border-radius: 100%; box-shadow: 0 0 3px;" alt="">
            <button class="btn btn-primary" style="height: 50%;">Alterar foto de perfil</button>
        </div>
        <div class="row d-flex justify-content-between m-2">
            <p id="nome">Nome: </p>
            <button class="btn btn-primary" id="btn_nome">Alterar</button>
        </div>
        <div class="row d-flex justify-content-between m-2">
            <p id="email">Email: </p>
            <button class="btn btn-primary" id="btn_email">Alterar</button>
        </div>
        <div class="row d-flex justify-content-between m-2">
            <p id="bio">Bio: </p>
            <button class="btn btn-primary" id="btn_bio">Alterar</button>
        </div>
        <div class="row d-flex justify-content-between m-2">
            <button class="btn btn-secondary" onclick="document.location.href='/'" >Voltar</button>
            <button class="btn btn-danger" id="btn_senha">Alterar senha</button>
        </div>
    </div>
    <form method="post" class="container" id="config_div">
        <label for="e" id="labele"></label>
        <input type="text" class="form-control" name="e" id="e">
        <label for="senha">Insira sua senha</label>
        <input type="password" class="form-control" name="e" id="senha">
        <button class="btn btn-primary my-2" id="btn_att">Atualizar</button>
    </form>
</body>
</html>
