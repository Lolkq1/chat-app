<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>configuraçoes de conta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
    <div class="container" style="overflow-wrap: break-word; width: 40%;">
        <div class="row d-flex align-content-center justify-content-between m-2">
            <img src="pfp.png" style="width: 70px; height: 70px; border-radius: 100%; box-shadow: 0 0 3px;" alt="">
            <button class="btn btn-primary" style="height: 50%;">Alterar foto de perfil</button>
        </div>
        <div class="row d-flex justify-content-between m-2">
            <p>Nome: </p>
            <button class="btn btn-primary">Alterar</button>
        </div>
        <div class="row d-flex justify-content-between m-2">
            <p>Email: </p>
            <button class="btn btn-primary">Alterar</button>
        </div>
        <div class="row d-flex justify-content-between m-2">
            <p>Bio: </p>
            <button class="btn btn-primary">Alterar</button>
        </div>
        <div class="row d-flex flex-end m-2">
            <button style="position: relative; transform: translate(-100%); left: 100%;" class="btn btn-danger">Alterar senha</button>
        </div>
    </div>
</body>
</html>
